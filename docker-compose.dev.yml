services:
  db:
    image: postgres:17-alpine
    container_name: nuxipro-postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - nuxipro_pg_data:/var/lib/postgresql/data

volumes:
  nuxipro_pg_data:
