<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Cloud NuxiPro</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --loader-accent: #0f766e; /* teal signature — unique couleur d'accent */
      }
      html {
        background: #f6f7f9;
      }
      html.dark {
        background: #010102;
      }

      /* ── Boot loader — zonas: logo flottant, glow signature, sheen matière.
           Sortie: saut continu loader → app (scale+blur+fade, composited only). ── */
      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #f6f7f9;
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
        transition:
          opacity 380ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 380ms cubic-bezier(0.16, 1, 0.3, 1),
          filter 380ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.dark #root-loader {
        background: #010102;
      }
      #root-loader.is-hiding {
        opacity: 0;
        transform: scale(0.985);
        filter: blur(6px);
        pointer-events: none;
      }

      .loader-mark {
        position: relative;
        width: 64px;
        height: 64px;
      }

      /* Halo signature: un seul cycle qui s'installe, jamais en boucle */
      .loader-glow {
        position: absolute;
        inset: -60%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(15, 118, 110, 0.26) 0%,
          rgba(15, 118, 110, 0.09) 42%,
          transparent 70%
        );
        opacity: 0;
        transform: scale(0.7);
        animation: glowSettle 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes glowSettle {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        55% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
      }

      /* Entrance: opacity + scale + blur en un seul ease-out expo (transform/filter composited) */
      .loader-logo {
        position: relative;
        width: 64px;
        height: 64px;
        opacity: 0;
        transform: scale(0.92);
        filter: blur(10px);
        animation: logoIn 640ms cubic-bezier(0.16, 1, 0.3, 1) 60ms forwards;
      }
      @keyframes logoIn {
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }

      /* Sheen matière: bande lumineuse monochrome, masquée à la silhouette du logo, un seul passage */
      .loader-sheen {
        display: none;
      }
      @supports (mask-image: url("/icon.svg")) {
        .loader-sheen {
          display: block;
          position: absolute;
          inset: 0;
          background: linear-gradient(
            105deg,
            transparent 42%,
            rgba(255, 255, 255, 0.8) 50%,
            transparent 58%
          );
          background-size: 300% 100%;
          background-repeat: no-repeat;
          background-position: 200% 0;
          mask-image: url("/icon.svg");
          mask-mode: alpha;
          mask-size: 100% 100%;
          mask-repeat: no-repeat;
          opacity: 1;
          animation: sheenSweep 700ms cubic-bezier(0.4, 0, 0.2, 1) 760ms forwards;
        }
        @keyframes sheenSweep {
          from {
            background-position: 200% 0;
          }
          to {
            background-position: -200% 0;
          }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root-loader {
          transition: none;
        }
        #root-loader.is-hiding {
          transform: none;
          filter: none;
        }
        .loader-glow,
        .loader-sheen {
          animation: none;
        }
        .loader-logo {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
    </style>
    <script>
      let t;
      let d;
      try {
        t = localStorage.getItem("theme");
        d = t ? t === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
        if (d) document.documentElement.classList.add("dark");
      } catch (_e) {}
    </script>
  </head>

  <body>
    <div id="root-loader" aria-hidden="true">
      <div class="loader-mark">
        <div class="loader-glow"></div>
        <img
          src="/icon.svg"
          alt=""
          width="64"
          height="64"
          class="loader-logo"
        />
        <div class="loader-sheen"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
