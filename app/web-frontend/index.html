<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
    />
    <title>Cloud Nuxipro</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f6f7f9;
      }
      html.dark {
        background: #010102;
      }
      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
        background: #f6f7f9;
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
        transition:
          opacity 400ms cubic-bezier(0.25, 0.1, 0.25, 1),
          transform 400ms cubic-bezier(0.25, 0.1, 0.25, 1),
          filter 400ms cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      html.dark #root-loader {
        background: #010102;
      }
      #root-loader.is-hiding {
        opacity: 0;
        transform: scale(0.98);
        filter: blur(4px);
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #root-loader {
          transition: none;
        }
        #root-loader.is-hiding {
          transform: none;
          filter: none;
        }
      }
      #root-loader .loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 20px 24px;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid #e2e5eb;
        box-shadow:
          0 1px 3px rgba(17, 19, 24, 0.08),
          0 8px 24px rgba(17, 19, 24, 0.1);
        opacity: 0;
        transform: scale(0.97) translateY(4px);
        animation: loaderEnter 400ms cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }
      @keyframes loaderEnter {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      html.dark #root-loader .loader-card {
        background: #0f1011;
        border-color: #23252a;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      }
      #root-loader .loader-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      #root-loader .loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        overflow: hidden;
        background: transparent;
      }
      #root-loader .loader-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #2d6a9f;
        animation: loading-bar 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes loading-bar {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
    <script>
      let t;
      let d;
      try {
        t = localStorage.getItem("theme");
        d = t ? t === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
        if (d) document.documentElement.classList.add("dark");
      } catch (_e) {}
    </script>
  </head>

  <body>
    <div id="root-loader" aria-hidden="true">
      <div class="loader-bar" aria-hidden="true"></div>
      <div class="loader-card">
        <img src="/icon.svg" alt="" width="64" height="64" class="loader-logo" aria-hidden="true" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
