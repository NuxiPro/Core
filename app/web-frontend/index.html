<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Cloud NuxiPro</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f6f7f9;
      }
      html.dark {
        background: #010102;
      }

      /* ── Boot loader v3 — cycle supernova synchronisé.
           P1 burst (0-800ms) → P2 implosion (900ms) → tension (respiration,
           boucle infinie) → P3 nova sur app-ready (flash dédié, zéro saut
           quel que soit le timing). Timeline 100% CSS: l'animation continue
           même sans JS. Seule la sortie dépend de JS. ── */
      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #f6f7f9;
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
        transition:
          opacity 260ms cubic-bezier(0.23, 1, 0.32, 1),
          transform 260ms cubic-bezier(0.23, 1, 0.32, 1),
          filter 260ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      html.dark #root-loader {
        background: #010102;
      }
      #root-loader.is-hiding {
        opacity: 0;
        transform: scale(0.99);
        filter: blur(4px);
        pointer-events: none;
      }

      .loader-mark {
        position: relative;
        width: 68px;
        height: 68px;
      }

      /* ── Halo — présence calme pendant le chargement ── */
      .loader-glow {
        position: absolute;
        inset: -45%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(15, 118, 110, 0.18) 0%,
          rgba(15, 118, 110, 0.06) 42%,
          transparent 70%
        );
        opacity: 0;
        transform: scale(0.86);
        animation:
          glowIn 500ms cubic-bezier(0.23, 1, 0.32, 1) forwards,
          glowBreathe 1800ms ease-in-out 650ms infinite alternate;
      }
      @keyframes glowIn {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 0.72;
          transform: scale(1);
        }
      }
      @keyframes glowBreathe {
        from {
          opacity: 0.72;
          transform: scale(1);
        }
        to {
          opacity: 0.86;
          transform: scale(1.04);
        }
      }

      /* ── Anneau — tracé net, sans implosion décorative ── */
      .loader-ring {
        position: absolute;
        inset: 0;
        width: 68px;
        height: 68px;
        transform: rotate(-90deg);
      }
      .loader-ring circle {
        fill: none;
        stroke: #0f766e;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        opacity: 0.82;
        animation: ringDraw 650ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      @keyframes ringDraw {
        from {
          stroke-dashoffset: 100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      /* ── Logo — entrée courte, puis respiration presque imperceptible ── */
      .loader-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        opacity: 0;
        transform: scale(0.96) translateY(3px);
        animation:
          logoLand 420ms cubic-bezier(0.23, 1, 0.32, 1) 80ms forwards,
          logoBreathe 1800ms ease-in-out 650ms infinite alternate;
      }
      @keyframes logoLand {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes logoBreathe {
        from {
          opacity: 0.96;
          transform: scale(1);
        }
        to {
          opacity: 1;
          transform: scale(1.015);
        }
      }

      /* ── Nova (P3, class .nova ajoutée par JS sur app-ready) —
           flash dédié depuis le centre: indépendant de l'état du glow,
           donc aucun saut, même si le boot est ultra rapide ── */
      .loader-nova {
        position: absolute;
        inset: -60%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(15, 118, 110, 0.28) 0%,
          rgba(15, 118, 110, 0.08) 45%,
          transparent 70%
        );
        opacity: 0;
        transform: scale(0);
        pointer-events: none;
      }
      #root-loader.nova .loader-nova {
        animation: novaFinale 280ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      @keyframes novaFinale {
        from {
          opacity: 0.45;
          transform: scale(0.86);
        }
        to {
          opacity: 0;
          transform: scale(2.8);
        }
      }
      /* Le logo accompagne la sortie sans rebond visible. */
      #root-loader.nova .loader-logo {
        animation: logoNova 280ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      @keyframes logoNova {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root-loader {
          transition: none;
        }
        #root-loader.is-hiding {
          transform: none;
          filter: none;
        }
        .loader-glow,
        .loader-nova {
          opacity: 0;
        }
        .loader-ring circle {
          stroke-dashoffset: 0;
          opacity: 0.9;
        }
        .loader-logo {
          opacity: 1;
          transform: none;
        }
        .loader-glow,
        .loader-ring,
        .loader-ring circle,
        .loader-logo,
        #root-loader.nova .loader-nova,
        #root-loader.nova .loader-logo {
          animation: none;
        }
      }
    </style>
    <script>
      let t;
      let d;
      try {
        t = localStorage.getItem("theme");
        d = t ? t === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
        if (d) document.documentElement.classList.add("dark");
      } catch (_e) {}
    </script>
  </head>

  <body>
    <div id="root-loader" aria-hidden="true">
      <div class="loader-mark">
        <div class="loader-glow"></div>
        <svg class="loader-ring" viewBox="0 0 68 68" aria-hidden="true">
          <circle cx="34" cy="34" r="32" pathLength="100" />
        </svg>
        <img
          src="/icon.svg"
          alt=""
          width="48"
          height="48"
          class="loader-logo"
        />
        <div class="loader-nova"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
