    <ellipse cx="220" cy="150" rx="260" ry="180" fill="#ffffff" opacity="0.5"/>
    <rect x="0" y="0" width="800" height="800" fill="url(#sheen1)"/>
    <rect x="0" y="0" width="800" height="800" fill="url(#sheen2)"/>
    <ellipse cx="600" cy="700" rx="300" ry="150" fill="url(#softShadowGrad)"/>
